<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Study Notes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 9px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 16px;
}

#message {
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="box">

<h1>🔐 Admin Login</h1>

<input
    type="email"
    id="email"
    placeholder="Admin Email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
>

<button onclick="login()">
    Login
</button>

<p id="message"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.innerText = "Login हो रहा है...";

    const { data, error } =
        await client.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        message.innerText =
            "❌ Login failed: " + error.message;

        return;
    }

    message.innerText =
        "✅ Login सफल!";

    setTimeout(() => {

        window.location.href =
            "dashboard.html";

    }, 800);
}

</script>

</body>
</html>
